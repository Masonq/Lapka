services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: lapabg
      POSTGRES_PASSWORD: lapabg
      POSTGRES_DB: lapabg
      POSTGRES_INITDB_ARGS: "--locale=en_US.UTF-8"
      LANG: en_US.UTF-8
    volumes:
      - lapabg_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://lapabg:lapabg@db:5432/lapabg
      JWT_SECRET: ${JWT_SECRET:?Задай JWT_SECRET в .env, сгенерировать - python3 -c "import secrets; print(secrets.token_hex(32))"}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      UPLOAD_DIR: /app/uploads
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://lapa.flatro.app}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      - db
    ports:
      - "127.0.0.1:8020:8000"
    volumes:
      - lapabg_uploads:/app/uploads

volumes:
  lapabg_pgdata:
  lapabg_uploads:
