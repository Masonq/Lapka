# Пререндер для поисковиков/соцсетей (Googlebot, Telegram, WhatsApp, Facebook и т.д.) —
# см. backend/app/routers/prerender.py. Обычные пользователи никогда не видят эти
# ответы, только известные краулеры по User-Agent
map $http_user_agent $is_bot {
    default 0;
    ~*googlebot 1;
    ~*bingbot 1;
    ~*yandex 1;
    ~*duckduckbot 1;
    ~*baiduspider 1;
    ~*facebookexternalhit 1;
    ~*twitterbot 1;
    ~*linkedinbot 1;
    ~*telegrambot 1;
    ~*whatsapp 1;
    ~*slackbot 1;
    ~*discordbot 1;
    ~*pinterest 1;
    ~*redditbot 1;
    ~*applebot 1;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    root /opt/lapabg/frontend/dist;
    index index.html;

    # Базовые security-заголовки. Content-Security-Policy сознательно не добавлен —
    # без браузера под рукой нельзя надёжно проверить, что он не сломает подключение
    # Google Fonts или инлайновые стили React; ломать сайт хуже, чем не иметь заголовка.
    # X-Content-Type-Options продублирован ниже в /uploads/ и статике: nginx не наследует
    # add_header из server{} в location{}, если у location уже есть свой add_header
    # (а он есть — Cache-Control)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /api/ws {
        # JWT-токен передаётся через query-параметр (?token=...) — единственный
        # способ аутентификации при WebSocket handshake, браузер не поддерживает
        # кастомные заголовки для него. Без access_log off токен (живёт 30 дней)
        # попадал бы в открытом виде в access.log при каждом подключении —
        # стандартный формат логов включает полный URI вместе с query-строкой
        access_log off;
        proxy_pass http://127.0.0.1:8020/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8020/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8020/uploads/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = / {
        if ($is_bot) {
            proxy_pass http://127.0.0.1:8020/api/prerender;
        }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    location ~ ^/posts/([^/]+)/?$ {
        if ($is_bot) {
            proxy_pass http://127.0.0.1:8020/api/prerender/posts/$1;
        }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    location ~ ^/marketplace/([^/]+)/?$ {
        if ($is_bot) {
            proxy_pass http://127.0.0.1:8020/api/prerender/marketplace/$1;
        }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    location ~ ^/events/([^/]+)/?$ {
        if ($is_bot) {
            proxy_pass http://127.0.0.1:8020/api/prerender/events/$1;
        }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(?:css|js|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
