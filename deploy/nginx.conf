server {
    listen 80;
    server_name lapa.flatro.app;

    root /opt/lapabg/frontend/dist;
    index index.html;

    # Базовые security-заголовки. Content-Security-Policy сознательно не добавлен —
    # без браузера под рукой нельзя надёжно проверить, что он не сломает подключение
    # Google Fonts или инлайновые стили React; ломать сайт хуже, чем не иметь заголовка.
    # X-Content-Type-Options продублирован ниже в /uploads/ и статике: nginx не наследует
    # add_header из server{} в location{}, если у location уже есть свой add_header
    # (а он есть — Cache-Control)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8020/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8020/uploads/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
